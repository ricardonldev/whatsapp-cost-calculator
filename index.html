<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Cost Calculator</title>
<meta name="description" content="Calcula cuánto te costará la API de WhatsApp Business desde el 1 de octubre de 2026, cuando Meta empieza a cobrar los mensajes de servicio. Tarifas oficiales de Meta en EUR.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2325a55f'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'>€</text></svg>">
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --text: #1b1f1d; --muted: #5d6661; --border: #dfe3e0;
    --accent: #1f8f52; --accent-soft: #e3f3ea; --warn: #b3541e; --warn-soft: #fbece3;
    --bar-before: #9aa5a0; --bar-after: #c8643a; --bar-opt: #1f8f52;
    --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111513; --surface: #191e1b; --text: #e8ece9; --muted: #9aa5a0; --border: #2a312d;
      --accent: #3fbf78; --accent-soft: #173323; --warn: #e58a5c; --warn-soft: #3a2419;
      --bar-before: #5f6a65; --bar-after: #e07a4f; --bar-opt: #3fbf78; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0; max-width: 640px; }
  .badge { display: inline-block; background: var(--warn-soft); color: var(--warn); font-weight: 600;
    font-size: .8rem; padding: 4px 10px; border-radius: 99px; margin-bottom: 12px; }
  .lang { border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 99px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: .9rem; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; margin-top: 24px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 14px; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 4px; }
  label small { display: block; font-weight: 400; color: var(--muted); }
  input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  details { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
  .kpi { border-radius: 12px; padding: 14px; background: var(--bg); }
  .kpi .v { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .82rem; color: var(--muted); }
  .kpi.warn { background: var(--warn-soft); } .kpi.warn .v { color: var(--warn); }
  .kpi.good { background: var(--accent-soft); } .kpi.good .v { color: var(--accent); }
  .bars { margin: 20px 0 8px; display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 10px; font-size: .9rem; }
  @media (max-width: 520px) { .bar { grid-template-columns: 1fr 80px; } .bar .track { grid-column: 1 / -1; grid-row: 2; } }
  .track { height: 14px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transition: width .3s ease; }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; }
  tfoot td { font-weight: 700; border-bottom: none; }
  .note { font-size: .85rem; color: var(--muted); }
  .method { margin-top: 20px; }
  .method ul { padding-left: 18px; margin: 8px 0 0; }
  a { color: var(--accent); }
  footer { margin-top: 28px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="badge" data-i18n="badge"></span>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <button class="lang" id="lang" type="button" aria-label="Change language"></button>
  </header>

  <div class="grid">
    <form class="card" id="form" autocomplete="off">
      <h2 data-i18n="inputs"></h2>
      <label for="market"><span data-i18n="market"></span></label>
      <select id="market"></select>

      <div class="row">
        <div>
          <label for="conversations"><span data-i18n="conversations"></span><small data-i18n="conversationsHint"></small></label>
          <input id="conversations" type="number" min="0" step="1" value="1500" inputmode="numeric">
        </div>
        <div>
          <label for="replies"><span data-i18n="replies"></span><small data-i18n="repliesHint"></small></label>
          <input id="replies" type="number" min="0" step="0.5" value="6" inputmode="decimal">
        </div>
      </div>

      <label for="optimized"><span data-i18n="optimized"></span><small data-i18n="optimizedHint"></small></label>
      <input id="optimized" type="number" min="0" step="0.5" value="3" inputmode="decimal">

      <label for="ctwa"><span data-i18n="ctwa"></span><small data-i18n="ctwaHint"></small></label>
      <input id="ctwa" type="number" min="0" max="100" step="1" value="0" inputmode="numeric">

      <details>
        <summary data-i18n="templates"></summary>
        <div class="row">
          <div><label for="marketing" data-i18n="marketing"></label><input id="marketing" type="number" min="0" value="0" inputmode="numeric"></div>
          <div><label for="authentication" data-i18n="authentication"></label><input id="authentication" type="number" min="0" value="0" inputmode="numeric"></div>
          <div><label for="utilityOutside"><span data-i18n="utilityOutside"></span></label><input id="utilityOutside" type="number" min="0" value="0" inputmode="numeric"></div>
          <div><label for="utilityInside"><span data-i18n="utilityInside"></span></label><input id="utilityInside" type="number" min="0" value="0" inputmode="numeric"></div>
        </div>
      </details>
    </form>

    <section class="card" aria-live="polite">
      <h2 data-i18n="results"></h2>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kBefore"></div><div class="l" data-i18n="kBefore"></div></div>
        <div class="kpi warn"><div class="v" id="kAfter"></div><div class="l" data-i18n="kAfter"></div></div>
        <div class="kpi good"><div class="v" id="kSave"></div><div class="l" data-i18n="kSave"></div></div>
      </div>

      <div class="bars" id="bars"></div>

      <table>
        <thead><tr><th data-i18n="category"></th><th data-i18n="colBefore"></th><th data-i18n="colAfter"></th><th data-i18n="colOpt"></th></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot><tr><td data-i18n="total"></td><td id="tB"></td><td id="tA"></td><td id="tO"></td></tr></tfoot>
      </table>
      <p class="note" id="rateNote"></p>
    </section>
  </div>

  <section class="card method">
    <h2 data-i18n="howTitle"></h2>
    <ul id="howList"></ul>
  </section>

  <footer>
    <span data-i18n="footer"></span>
    <a href="https://github.com/ricardonldev/whatsapp-cost-calculator">GitHub</a>
  </footer>
</div>

<script type="module">
import { RATE_CARD } from './rates.js';
import { compare } from './calc.js';

const T = {
  es: {
    badge: 'Cambio de Meta · 1 de octubre de 2026',
    title: '¿Cuánto te costará WhatsApp Business desde octubre?',
    lead: 'Desde el 1 de octubre de 2026 Meta cobra también las respuestas dentro de la ventana de 24 h (mensajes de servicio). Si tu bot o tu equipo responde con muchos mensajes cortos, la factura sube. Calcula cuánto y cuánto ahorrarías respondiendo con menos mensajes.',
    inputs: 'Tus datos (al mes)', market: 'País de tus clientes',
    conversations: 'Conversaciones que inician tus clientes', conversationsHint: 'Al mes',
    replies: 'Respuestas por conversación', repliesHint: 'Mensajes que envía tu bot o tu equipo',
    optimized: 'Respuestas por conversación tras optimizar', optimizedHint: 'P. ej., agrupando la información en menos mensajes',
    ctwa: '% de conversaciones desde anuncios de clic a WhatsApp', ctwaHint: 'Esas respuestas siguen siendo gratis durante 72 h',
    templates: 'Plantillas (opcional): marketing, utilidad, autenticación',
    marketing: 'Marketing', authentication: 'Autenticación',
    utilityOutside: 'Utilidad fuera de ventana', utilityInside: 'Utilidad dentro de ventana 24 h',
    results: 'Resultado', kBefore: 'Hasta sept. 2026 / mes', kAfter: 'Desde oct. 2026 / mes', kSave: 'Ahorro al año optimizando',
    barBefore: 'Hasta septiembre', barAfter: 'Desde octubre', barOpt: 'Octubre, optimizado',
    category: 'Categoría', colBefore: 'Hasta sept.', colAfter: 'Desde oct.', colOpt: 'Optimizado', total: 'Total / mes',
    service: 'Servicio (respuestas)', utility: 'Utilidad',
    rateNote: (m, r) => `Tarifa oficial de Meta en ${m}: marketing ${r[0]}, utilidad/autenticación ${r[1]} por mensaje (vigente desde el 1/7/2026). Desde el 1/10/2026 las respuestas de servicio cuestan lo mismo que utilidad.`,
    howTitle: 'Cómo se calcula y qué no incluye',
    how: [
      'Tarifas de la <a href="SRC">hoja oficial de Meta en EUR</a> (vigente desde el 1 de julio de 2026) y la <a href="RULE">regla de mensajes de servicio</a> que entra en vigor el 1 de octubre de 2026.',
      'Hasta el 30/9: las respuestas dentro de la ventana de 24 h y las plantillas de utilidad dentro de ella son gratis. Desde el 1/10: ambas se cobran; las de servicio, a la tarifa de utilidad del país y sin descuentos por volumen.',
      'Las conversaciones que empiezan en un anuncio de clic a WhatsApp siguen siendo gratis durante 72 h.',
      'No incluye: descuentos por volumen de utilidad y autenticación (bajan el coste), IVA, la cuota de tu proveedor (BSP) ni Meta Business Agent, que se cobra por tokens.',
      'Es una estimación: el importe exacto lo marca tu factura de Meta.',
    ],
    footer: 'Hecho por Ricardo · código abierto en',
    lang: 'English',
  },
  en: {
    badge: 'Meta change · 1 October 2026',
    title: 'How much will WhatsApp Business cost you from October?',
    lead: 'From 1 October 2026 Meta also charges replies inside the 24-hour window (service messages). If your bot or team replies with many short messages, the bill goes up. See how much, and how much you would save by replying with fewer messages.',
    inputs: 'Your numbers (per month)', market: "Your customers' country",
    conversations: 'Customer-initiated conversations', conversationsHint: 'Per month',
    replies: 'Replies per conversation', repliesHint: 'Messages your bot or team sends',
    optimized: 'Replies per conversation after optimizing', optimizedHint: 'E.g. grouping information into fewer messages',
    ctwa: '% of conversations from Click-to-WhatsApp ads', ctwaHint: 'Those replies stay free for 72 h',
    templates: 'Templates (optional): marketing, utility, authentication',
    marketing: 'Marketing', authentication: 'Authentication',
    utilityOutside: 'Utility outside window', utilityInside: 'Utility inside 24 h window',
    results: 'Result', kBefore: 'Until Sep 2026 / month', kAfter: 'From Oct 2026 / month', kSave: 'Yearly saving if optimized',
    barBefore: 'Until September', barAfter: 'From October', barOpt: 'October, optimized',
    category: 'Category', colBefore: 'Until Sep', colAfter: 'From Oct', colOpt: 'Optimized', total: 'Total / month',
    service: 'Service (replies)', utility: 'Utility',
    rateNote: (m, r) => `Official Meta rate in ${m}: marketing ${r[0]}, utility/authentication ${r[1]} per message (effective 1 Jul 2026). From 1 Oct 2026 service replies cost the same as utility.`,
    howTitle: "How it's calculated and what's not included",
    how: [
      'Rates from <a href="SRC">Meta’s official EUR rate card</a> (effective 1 July 2026) and the <a href="RULE">service message rule</a> that takes effect on 1 October 2026.',
      'Until 30 Sep: replies inside the 24-hour window and utility templates inside it are free. From 1 Oct: both are charged; service at the market’s utility rate, with no volume tiers.',
      'Conversations that start from a Click-to-WhatsApp ad stay free for 72 hours.',
      'Not included: utility/authentication volume tiers (they lower the cost), VAT, your provider’s (BSP) fees, or Meta Business Agent, which is billed per token.',
      'This is an estimate: your Meta invoice is the final figure.',
    ],
    footer: 'Built by Ricardo · open source on',
    lang: 'Español',
  },
};
const MARKET_ES = {
  'Spain': 'España', 'Mexico': 'México', 'Colombia': 'Colombia', 'Argentina': 'Argentina', 'Chile': 'Chile',
  'Peru': 'Perú', 'Brazil': 'Brasil', 'Rest of Latin America': 'Resto de Latinoamérica', 'United Kingdom': 'Reino Unido',
  'France': 'Francia', 'Germany': 'Alemania', 'Italy': 'Italia', 'Netherlands': 'Países Bajos',
  'Rest of Western Europe': 'Resto de Europa occidental', 'North America': 'Norteamérica',
};

let lang = 'es';
try { lang = localStorage.getItem('wcc-lang') || (navigator.language || 'es').slice(0, 2); } catch { /* storage blocked */ }
if (!T[lang]) lang = 'en';

const $ = (id) => document.getElementById(id);
const eur = (x) => new Intl.NumberFormat(lang === 'es' ? 'es-ES' : 'en-GB', { style: 'currency', currency: 'EUR' }).format(x);
const rate = (x) => new Intl.NumberFormat(lang === 'es' ? 'es-ES' : 'en-GB', { style: 'currency', currency: 'EUR', minimumFractionDigits: 4 }).format(x);
const marketName = (m) => (lang === 'es' ? MARKET_ES[m] || m : m);

function renderStatic() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  $('lang').textContent = t.lang;
  $('howList').innerHTML = t.how
    .map((h) => `<li>${h.replace('SRC', RATE_CARD.sourceUrl).replace('RULE', RATE_CARD.serviceRuleUrl)}</li>`).join('');
  const sel = $('market');
  const current = sel.value || 'Spain';
  sel.innerHTML = Object.keys(RATE_CARD.markets).map((m) => `<option value="${m}">${marketName(m)}</option>`).join('');
  sel.value = current;
}

function read() {
  const n = (id) => Number($(id).value);
  return {
    market: $('market').value,
    v: {
      conversations: n('conversations'), repliesPerConversation: n('replies'),
      freeEntryShare: n('ctwa') / 100, marketing: n('marketing'), authentication: n('authentication'),
      utilityOutside: n('utilityOutside'), utilityInside: n('utilityInside'),
    },
    optimized: n('optimized'),
  };
}

function render() {
  const t = T[lang];
  const { market, v, optimized } = read();
  const rates = RATE_CARD.markets[market];
  const r = compare(rates, v, optimized);

  $('kBefore').textContent = eur(r.before.total);
  $('kAfter').textContent = eur(r.after.total);
  $('kSave').textContent = eur(Math.max(0, r.yearlySaving));

  const max = Math.max(r.before.total, r.after.total, r.optimized.total, 0.01);
  $('bars').innerHTML = [
    [t.barBefore, r.before.total, 'var(--bar-before)'],
    [t.barAfter, r.after.total, 'var(--bar-after)'],
    [t.barOpt, r.optimized.total, 'var(--bar-opt)'],
  ].map(([label, val, color]) => `
    <div class="bar"><span>${label}</span>
      <div class="track"><div class="fill" style="width:${(val / max) * 100}%;background:${color}"></div></div>
      <span class="num">${eur(val)}</span></div>`).join('');

  const rows = [['service', 'service'], ['utility', 'utility'], ['marketing', 'marketing'], ['authentication', 'authentication']];
  $('tbody').innerHTML = rows.map(([key, label]) =>
    `<tr><td>${t[label]}</td><td>${eur(r.before[key])}</td><td>${eur(r.after[key])}</td><td>${eur(r.optimized[key])}</td></tr>`).join('');
  $('tB').textContent = eur(r.before.total);
  $('tA').textContent = eur(r.after.total);
  $('tO').textContent = eur(r.optimized.total);
  $('rateNote').textContent = t.rateNote(marketName(market), rates.map(rate));
}

$('form').addEventListener('input', render);
$('lang').addEventListener('click', () => {
  lang = lang === 'es' ? 'en' : 'es';
  try { localStorage.setItem('wcc-lang', lang); } catch { /* storage blocked */ }
  renderStatic(); render();
});
renderStatic(); render();
</script>
</body>
</html>
